plugins { id 'com.android.application' }

android {
    namespace 'org.catsystem2.player'
    compileSdk 37
    compileSdkMinor 0
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.catsystem2.player'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=none' }
        }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    sourceSets {
        main.jniLibs.srcDirs = [System.getenv('CS2_ANDROID_MEDIA_LIBS') ?: 'src/main/jniLibs']
        if (System.getenv('CS2_ANDROID_RUST_LIBS')) {
            main.jniLibs.srcDirs += [System.getenv('CS2_ANDROID_RUST_LIBS')]
        }
        if (System.getenv('CS2_ANDROID_MEDIA_NOTICES')) {
            main.assets.srcDirs += [System.getenv('CS2_ANDROID_MEDIA_NOTICES')]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
if (System.getenv('CS2_ANDROID_BUILD_ROOT')) {
    layout.buildDirectory = file(System.getenv('CS2_ANDROID_BUILD_ROOT'))
}
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
