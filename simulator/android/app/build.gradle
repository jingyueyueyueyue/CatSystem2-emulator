plugins { id 'com.android.application' }

def localProperties = new Properties()
def localPropertiesFile = rootProject.layout.projectDirectory.file('local.properties')
localProperties.load(new StringReader(providers.fileContents(localPropertiesFile).asText.getOrElse('')))
def nativeBuildPath = localProperties.getProperty('cs2.nativeBuildDir')
def nativeBuild = nativeBuildPath ? rootProject.file(nativeBuildPath) : null
def rustLibs = System.getenv('CS2_ANDROID_RUST_LIBS') ?: (nativeBuild ? new File(nativeBuild, 'rust-libs') : null)
def mediaLibs = System.getenv('CS2_ANDROID_MEDIA_LIBS') ?: (nativeBuild ? new File(nativeBuild, 'media-libs') : null)
def mediaNotices = System.getenv('CS2_ANDROID_MEDIA_NOTICES') ?: (nativeBuild ? new File(nativeBuild, 'media-notices') : null)
def cmakeRustLibs = rustLibs ? file(rustLibs).absolutePath.replace('\\', '/') : ''

android {
    namespace 'org.catsystem2.player'
    compileSdk 37
    compileSdkMinor 0
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.catsystem2.player'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=none', "-DCS2_ANDROID_RUST_LIBS=${cmakeRustLibs}" }
        }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    sourceSets {
        main.jniLibs.srcDirs = [mediaLibs ?: 'src/main/jniLibs']
        if (rustLibs) {
            main.jniLibs.srcDirs += [rustLibs]
        }
        if (mediaNotices) {
            main.assets.srcDirs += [mediaNotices]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
if (System.getenv('CS2_ANDROID_BUILD_ROOT')) {
    layout.buildDirectory = file(System.getenv('CS2_ANDROID_BUILD_ROOT'))
}
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
