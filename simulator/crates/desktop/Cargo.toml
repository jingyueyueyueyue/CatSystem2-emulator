[package]
name = "cs2-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
anyhow.workspace = true
cs2-formats = { path = "../formats" }
cs2-renderer = { path = "../renderer" }
cs2-runtime = { path = "../runtime" }
cs2-script = { path = "../script" }
encoding_rs.workspace = true
fontdue.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
thiserror.workspace = true
lewton = "=0.10.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
pollster = { version = "0.4", optional = true }
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"], optional = true }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio"] }
